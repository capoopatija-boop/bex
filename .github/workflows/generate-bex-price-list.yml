name: Generate approved BEX price list PDF
on:
  push:
    branches: [fix/bex-approved-pdf-20261120]
    paths:
      - .github/workflows/generate-bex-price-list.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install reportlab
      - name: Regenerate approved PDF with Croatian typography
        run: python scripts/generate_approved_cjenik.py
      - name: Commit generated PDF to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/BEX_cjenik_bazna_10-09-2026_bez_PDV.pdf
          git commit -m "Replace BEX PDF with approved Croatian price list"
          git push
